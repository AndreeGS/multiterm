name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Push novo num PR cancela a rodada anterior; na main, cada commit roda ate o fim.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Binario do Electron que o npm ci baixa (~100 MB).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # postinstall recompila o node-pty para o ABI do Electron.
      - run: npm ci
      - run: npm run check
      # PTY real dentro do Electron; sem tela, num X virtual.
      - run: xvfb-run -a npm run smoke
