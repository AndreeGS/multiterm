name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall recompila o node-pty para o ABI do Electron.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # PTY real dentro do Electron; sem tela, num X virtual.
      - run: xvfb-run -a npm run smoke
