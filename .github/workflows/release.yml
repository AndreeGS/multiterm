name: Release

# Ao publicar uma tag de versao (git tag v0.2.0 && git push origin v0.2.0),
# gera o AppImage e o .deb e os anexa a uma Release do GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # A tag precisa bater com a versao do package.json: e ela que da nome aos arquivos. Antes de tudo: falha em segundos.
      - name: Confere a versao
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Electron (npm ci) e o que o electron-builder baixa (appimage, fpm...).
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-release-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run check
      - run: xvfb-run -a npm run smoke
      # O electron-builder nao publica sozinho (--publish never no script): quem cria a release e o gh abaixo.
      - run: npm run dist
      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.AppImage release/*.deb --title "MultiTerm $GITHUB_REF_NAME" --generate-notes
