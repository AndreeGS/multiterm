name: Release

# Ao publicar uma tag de versao (git tag v0.2.0 && git push origin v0.2.0),
# gera o AppImage e o .deb e os anexa a uma Release do GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # A tag precisa bater com a versao do package.json: e ela que da nome aos arquivos.
      - name: Confere a versao
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # O electron-builder nao publica sozinho (--publish never no script): quem cria a release e o gh abaixo.
      - run: npm run dist
      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.AppImage release/*.deb --title "MultiTerm $GITHUB_REF_NAME" --generate-notes
