version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Versao recem-publicada espera uma semana: um pacote comprometido costuma ser retirado antes disso.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      xterm:
        patterns: ['@xterm/*']
      dev-minor:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
